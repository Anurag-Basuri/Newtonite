services:
  mongodb:
    image: mongodb/mongodb-atlas-local:latest
    container_name: opsboard-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGODB_INITDB_DATABASE=opsboard
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opsboard-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/opsboard?replicaSet=rs0&directConnection=true
      - MONGODB_DB=opsboard
      - SESSION_SECRET=local-insecure-secret-key-change-in-prod-32bytes!
      - APP_ORIGIN=http://localhost:3000
      - AI_ENABLED=true
      - EMBEDDING_PROVIDER=fake
      - LLM_PROVIDER=fake
    depends_on:
      - mongodb

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opsboard-worker
    command: python -m app.worker
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/opsboard?replicaSet=rs0&directConnection=true
      - MONGODB_DB=opsboard
      - WORKER_POLL_INTERVAL_MS=1000
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opsboard-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  mongo_data:
